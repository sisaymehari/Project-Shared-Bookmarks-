<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shared Bookmarks</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <main>
      <h1>Shared Bookmarks</h1>

      <div class="layout">
        <section class="card">
          <label for="user-select">Choose a user</label>
          <select id="user-select" required>
            <option value="">Select the User</option>
          </select>

          <h2>User Bookmarks</h2>
          <div id="bookmarks-container"></div>
        </section>

        <section class="card">
          <h2>Add New Bookmark</h2>
          <form id="bookmark-form">
            <label for="bookmark-url">URL</label>
            <input id="bookmark-url" type="url" required />

            <label for="bookmark-title">Title</label>
            <input id="bookmark-title" type="text" required />

            <label for="bookmark-description">Description</label>
            <textarea id="bookmark-description" required></textarea>

            <button type="submit">Add bookmark</button>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
